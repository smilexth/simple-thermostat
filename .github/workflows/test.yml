name: Build

on:
  push:
    branches:
      - master
      - beta
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install and build
        run: |
          yarn install --frozen-lockfile
          yarn build
